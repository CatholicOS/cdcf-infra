# Local-only smoke-test stack. The credentials below are intentionally public
# and must never be reused outside a developer machine.

name: cdcf-auth-test

services:
  zitadel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: local-zitadel-db-password
    healthcheck:
      test: [CMD-SHELL, pg_isready -U zitadel -d zitadel]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.0
    command: start-from-init --masterkeyFromEnv
    depends_on:
      zitadel-db:
        condition: service_healthy
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: '5432'
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: local-zitadel-db-password
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: local-zitadel-db-password
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Exactly 32 characters; local test data only.
      ZITADEL_MASTERKEY: LocalOnlyMasterKey-32-Character!
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: '8080'
      ZITADEL_EXTERNALSECURE: 'false'
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: local-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: LocalTest1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: 'false'
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@example.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: 'true'
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: [CMD, /app/zitadel, ready]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  openfga-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openfga
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: local-openfga-db-password
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openfga -d openfga]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - openfga-db-data:/var/lib/postgresql/data

  openfga-migrate:
    image: openfga/openfga:v1.18.2
    command: migrate
    depends_on:
      openfga-db:
        condition: service_healthy
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:local-openfga-db-password@openfga-db:5432/openfga?sslmode=disable
    restart: 'no'

  openfga:
    image: openfga/openfga:v1.18.2
    command: run
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:local-openfga-db-password@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: local-openfga-api-key
      OPENFGA_HTTP_TLS_ENABLED: 'false'
      # OpenFGA does not allow its playground with preshared-key auth.
      OPENFGA_PLAYGROUND_ENABLED: 'false'
    ports:
      - '127.0.0.1:8081:8080'

volumes:
  zitadel-db-data:
  openfga-db-data:
