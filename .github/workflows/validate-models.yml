name: Validate model expectations

# Runs auth/validate-expectations.sh against every registered consumer's
# published expectations file whenever a model or the validator itself
# changes. See auth/validate-expectations.sh's header for why this exists:
# centralizing OpenFGA model ownership in this repo turned each consumer's
# own contract test into an assertion against a model this repo provisions,
# and that contract was previously enforced only downstream. This check
# moves enforcement into the PR that would break it.
#
# No secrets: every expectations_url in auth/models/consumers.json is a
# public raw.githubusercontent.com URL, and jq/curl are preinstalled on the
# ubuntu-latest runner.
#
# Two steps, not one, because they cover different things. The registry step
# is the actual enforcement, and now that LiturgicalCalendarAPI is registered
# it does exercise the walk against a real model. It still is not sufficient
# on its own: it covers only the rules that one consumer happens to declare
# and only the outcome "satisfied", so the schema rejections, the wildcard
# scope split, and the TTU/intersection/difference boundaries would all ship
# green if they regressed. The self-test step runs the fixtures under
# auth/models/testdata/ and asserts each one's exact exit code, including the
# ones that must fail, so those paths are exercised on every run.
#
# The registry step also depends on a network fetch from raw.githubusercontent
# per registered consumer, so it can fail for reasons unrelated to the commit
# under test. That is deliberate — exit 2 means the contract could not be
# verified, which is never the same as verified-and-satisfied — but it does
# make this job's red states worth reading before assuming a model broke.
#
# push and merge_group are here alongside pull_request so a change that
# reaches main without a PR run — a direct push, or a merge-queue entry whose
# combination with main was never itself PR-validated — is still checked.

on:
  pull_request:
    paths:
      - 'auth/models/**'
      - 'auth/validate-expectations.sh'
      - 'auth/validate-expectations.selftest.sh'
      - '.github/workflows/validate-models.yml'
  push:
    branches:
      - main
    paths:
      - 'auth/models/**'
      - 'auth/validate-expectations.sh'
      - 'auth/validate-expectations.selftest.sh'
      - '.github/workflows/validate-models.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Mirrors sync-to-vps.yml's naming convention. Unlike that workflow, runs
# here are independent per-PR/per-dispatch checks with no shared external
# state to serialize on, so a newer run can safely supersede an older one
# for the same ref instead of queuing behind it.
concurrency:
  group: validate-models-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs first: if the validator itself is broken, that is a more useful
      # failure than whatever it then reports about the registry.
      - name: Self-test the validator against its fixtures
        run: ./auth/validate-expectations.selftest.sh

      - name: Validate models against consumer expectations
        run: ./auth/validate-expectations.sh
