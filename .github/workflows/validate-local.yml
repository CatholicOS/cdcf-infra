name: Validate local Docker environments

# The local stacks are deliberately outside auth/** so they never sync to the
# production VPS. This workflow keeps their Compose models and helper scripts
# valid as the production-facing configuration evolves.

on:
  pull_request:
    paths:
      - 'local/**'
      - 'auth/nginx/zitadel.conf'
      - '.github/workflows/validate-local.yml'
  push:
    branches:
      - main
    paths:
      - 'local/**'
      - 'auth/nginx/zitadel.conf'
      - '.github/workflows/validate-local.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Validate local scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find local -type f -name '*.sh' -print0)

      - name: Check POSIX sh syntax
        run: sh -n local/production-like/components/nginx/entrypoint.sh

  compose:
    name: Validate Compose — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            files: -f local/dev/compose.yaml
          - name: dev proxy
            files: -f local/dev/compose.yaml -f local/dev/compose.proxy.yaml
          - name: PostgreSQL component
            files: -f local/production-like/components/postgres/compose.yaml
          - name: applications component
            files: -f local/production-like/components/applications/compose.yaml
          - name: nginx component
            files: -f local/production-like/components/nginx/compose.yaml
          - name: PostgreSQL scenario
            files: -f local/production-like/scenarios/compose.postgres.yaml
          - name: nginx scenario
            files: -f local/production-like/scenarios/compose.nginx.yaml
          - name: full production-like
            files: -f local/production-like/compose.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render and validate Compose model
        run: docker compose ${{ matrix.files }} config --quiet

  nginx-template:
    name: Validate shared nginx template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Exercise the same template renderer used by nginx:alpine in production
      # and in the fast dev proxy. Dummy host entries let nginx -t resolve both
      # upstream names without starting the application stack.
      - name: Render HTTP and HTTPS configurations
        run: |
          for protocol in http https; do
            docker run --rm \
              --add-host zitadel:127.0.0.1 \
              --add-host zitadel-login:127.0.0.1 \
              -e "NGINX_FORWARDED_PROTO=$protocol" \
              -v "$PWD/auth/nginx/zitadel.conf:/etc/nginx/templates/default.conf.template:ro" \
              nginx:alpine sh -ec '
                /docker-entrypoint.d/20-envsubst-on-templates.sh
                config=/etc/nginx/conf.d/default.conf
                test "$(grep -F -c '\''proxy_set_header Host $http_host;'\'' "$config")" -eq 2
                test "$(grep -F -c '\''proxy_set_header X-Forwarded-Host $http_host;'\'' "$config")" -eq 2
                test "$(grep -F -c "proxy_set_header X-Forwarded-Proto $NGINX_FORWARDED_PROTO;" "$config")" -eq 2
                ! grep -F '\''${NGINX_FORWARDED_PROTO}'\'' "$config"
                grep -F '\''Content-Security-Policy'\'' "$config" >/dev/null
                nginx -t
              '
          done

  integration:
    name: Run full Docker integration
    if: github.event_name == 'workflow_dispatch'
    needs: [scripts, compose, nginx-template]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: local/production-like
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the production-like environment
        run: docker compose up -d --build --wait

      - name: Verify cross-component integration
        run: ./scripts/verify.sh

      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Remove integration resources
        if: always()
        run: docker compose down -v --remove-orphans
